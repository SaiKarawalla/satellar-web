<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>OG Image — SATellar</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  background: #0B0F1E;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
.card {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #0B0F1E 0%, #131B33 60%, #1A1245 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 80px;
}
.card::before {
  content: '';
  position: absolute;
  top: -200px;
  right: -200px;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(74,108,247,0.4) 0%, rgba(74,108,247,0) 70%);
  pointer-events: none;
}
.card::after {
  content: '';
  position: absolute;
  bottom: -150px;
  left: -150px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(156,64,255,0.3) 0%, rgba(156,64,255,0) 70%);
  pointer-events: none;
}
.left {
  flex: 1;
  z-index: 1;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #4A6CF7;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 28px;
}
.eyebrow-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4A6CF7;
  box-shadow: 0 0 16px rgba(74,108,247,0.8);
}
h1 {
  font-size: 92px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1;
  color: #fff;
  margin-bottom: 24px;
}
h1 .accent {
  background: linear-gradient(90deg, #4A6CF7, #9c40ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tagline {
  font-size: 26px;
  font-weight: 500;
  color: #cbd5e1;
  line-height: 1.3;
  margin-bottom: 36px;
  max-width: 640px;
}
.stats {
  display: flex;
  gap: 36px;
}
.stat {
  display: flex;
  flex-direction: column;
}
.stat-num {
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1;
}
.stat-label {
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 6px;
}
.right {
  width: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.icon-wrap {
  width: 280px;
  height: 280px;
  border-radius: 64px;
  background: linear-gradient(135deg, #4A6CF7, #9c40ff);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 30px 80px rgba(74,108,247,0.5),
    0 0 0 1px rgba(255,255,255,0.1) inset;
}
.icon-wrap img {
  width: 200px;
  height: 200px;
  border-radius: 44px;
}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="eyebrow"><span class="eyebrow-dot"></span>SAT Prep That Works</div>
    <h1>SAT<span class="accent">ellar</span></h1>
    <div class="tagline">Adaptive SAT prep with real-time score prediction. Built for students who want results, not busywork.</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">2,200+</div>
        <div class="stat-label">Practice Questions</div>
      </div>
      <div class="stat">
        <div class="stat-num">Adaptive</div>
        <div class="stat-label">Difficulty</div>
      </div>
      <div class="stat">
        <div class="stat-num">iOS</div>
        <div class="stat-label">Available Now</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="icon-wrap">
      <img src="logo.png" alt="SATellar logo"/>
    </div>
  </div>
</div>
</body>
</html>
